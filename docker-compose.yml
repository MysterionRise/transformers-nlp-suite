# Transformers NLP Suite
#
#   docker compose up api redis                    # REST API on :8000 (canonical)
#   docker compose --profile ui up ui-launcher     # all demo UIs in one app on :7860
#   docker compose --profile individual up qa      # one UI per container (7860-7869)
#
# The "ui" and "individual" profiles both use host port 7860 for sentiment, so run
# one or the other.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: transformers-nlp-suite:latest
  networks:
    - nlp-network

x-ui-env: &ui-env
  PYTHONUNBUFFERED: "1"
  NLP_SERVER_NAME: "0.0.0.0"
  NLP_LOG_LEVEL: "INFO"

services:
  # Canonical API service
  api:
    <<: *app
    container_name: nlp-api
    command: python launch_ui.py api --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - NLP_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - huggingface_cache:/home/nlpuser/.cache/huggingface
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: nlp-redis
    ports:
      - "6379:6379"
    networks:
      - nlp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Every demo UI as a tab in one Gradio app: one process, one shared model cache
  ui-launcher:
    <<: *app
    container_name: nlp-ui-launcher
    command: python launch_ui.py all --host 0.0.0.0 --port 7860
    ports:
      - "7860:7860"
    environment: *ui-env
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - huggingface_cache:/home/nlpuser/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["ui"]

  # Individual UIs (optional): docker compose --profile individual up sentiment qa
  sentiment:
    <<: *app
    container_name: nlp-sentiment
    command: python -m ui.sentiment_playground
    ports:
      - "7860:7860"
    environment: *ui-env
    volumes:
      - huggingface_cache:/home/nlpuser/.cache/huggingface
    profiles: ["individual"]

  qa:
    <<: *app
    container_name: nlp-qa
    command: python -m ui.qa_system
    ports:
      - "7865:7865"
    environment: *ui-env
    volumes:
      - ./data:/app/data:ro
      - huggingface_cache:/home/nlpuser/.cache/huggingface
    profiles: ["individual"]

  generation:
    <<: *app
    container_name: nlp-generation
    command: python -m ui.generation_playground
    ports:
      - "7866:7866"
    environment: *ui-env
    volumes:
      - huggingface_cache:/home/nlpuser/.cache/huggingface
    profiles: ["individual"]

  zero-shot:
    <<: *app
    container_name: nlp-zero-shot
    command: python -m ui.zero_shot_classifier
    ports:
      - "7867:7867"
    environment: *ui-env
    volumes:
      - huggingface_cache:/home/nlpuser/.cache/huggingface
    profiles: ["individual"]

  translation:
    <<: *app
    container_name: nlp-translation
    command: python -m ui.translation_hub
    ports:
      - "7868:7868"
    environment: *ui-env
    volumes:
      - ./data:/app/data:ro
      - huggingface_cache:/home/nlpuser/.cache/huggingface
    profiles: ["individual"]

  vision:
    <<: *app
    container_name: nlp-vision
    command: python -m ui.vision_language_explorer
    ports:
      - "7869:7869"
    environment: *ui-env
    volumes:
      - huggingface_cache:/home/nlpuser/.cache/huggingface
    profiles: ["individual"]

volumes:
  huggingface_cache:
    driver: local

networks:
  nlp-network:
    driver: bridge
