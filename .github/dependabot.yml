# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # requirements.txt uses ">=" floors, so pip already installs new releases.
    # Only open a PR when a release falls outside the allowed range (or for security).
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Patterns-only group: update-types grouping is skipped for unpinned requirements,
    # which is why every bump used to arrive as its own PR.
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Ignore major version updates for stability-critical packages
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      # A version range, not update-types: the "semver-major" rule did not stop
      # Dependabot widening "<5.0.0" to "<6.0.0" (PR #30), and transformers 5 breaks
      # the real-model tests. Remove this once the code is migrated to transformers 5.
      - dependency-name: "transformers"
        versions: [">=5.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
