name: CI

on:
  push:
    branches: [ master, main, claude/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run black check
      run: |
        black --check --diff .

    - name: Run isort check
      run: |
        isort --check-only --diff .

    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test-fast:
    name: Fast Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --index-url https://download.pytorch.org/whl/cpu torch
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run fast tests
      run: |
        pytest -m "not slow" --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-slow:
    name: Integration Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-3.11-
          ${{ runner.os }}-pip-

    - name: Cache transformers models
      uses: actions/cache@v5
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-transformers-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-transformers-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --index-url https://download.pytorch.org/whl/cpu torch
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Download spacy model
      run: |
        python -m spacy download en_core_web_sm

    - name: Run slow/integration tests
      run: |
        pytest -m "slow" --cov=. --cov-report=xml --cov-report=term-missing
      timeout-minutes: 30

  test-all:
    name: All Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-3.11-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --index-url https://download.pytorch.org/whl/cpu torch
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Download spacy model
      run: |
        python -m spacy download en_core_web_sm

    - name: Run all tests
      run: |
        pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
      timeout-minutes: 45

    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v6

    - name: Build image
      run: docker compose build api

    - name: Start API and Redis
      run: docker compose up -d api redis

    - name: Wait for readiness
      run: |
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8000/ready; then echo; exit 0; fi
          sleep 2
        done
        echo "API did not become ready"
        curl -sS http://localhost:8000/ready || true
        exit 1

    - name: Smoke test the API
      run: |
        curl -fsS http://localhost:8000/health
        curl -fsS http://localhost:8000/api/v1/models > /dev/null
        # spaCy NER exercises the model baked into the image (no download needed)
        curl -fsS -X POST http://localhost:8000/api/v1/ner \
          -H "X-API-Key: demo-customer-intel-key" -H "Content-Type: application/json" \
          -d '{"text": "Apple opened a new office in Paris."}'
        # Missing credentials are 401; exhausting the anonymous limit is 429, never 500
        test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
          -X POST http://localhost:8000/api/v1/sentiment -d '{"text": "x"}')" = "401"
        codes=$(for i in $(seq 1 25); do curl -s -o /dev/null -w '%{http_code} ' http://localhost:8000/api/v1/models; done)
        echo "$codes"
        echo "$codes" | grep -q 429
        if echo "$codes" | grep -q 500; then echo "server error while rate limited"; exit 1; fi

    - name: Start the combined UI app
      run: |
        docker compose --profile ui up -d ui-launcher
        for i in $(seq 1 60); do
          if curl -fsS -o /dev/null http://localhost:7860/; then echo "UI is up"; exit 0; fi
          sleep 2
        done
        echo "UI did not start"
        exit 1

    - name: Container logs
      if: always()
      run: docker compose --profile ui logs --no-color --tail 200

    - name: Tear down
      if: always()
      run: docker compose --profile ui down -v

